services:
  telegram:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Run configure first}
      TG_STATE_KEY: ${TG_STATE_KEY:?Run configure first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Run configure first}
    volumes:
      - telegram_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Run configure first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      telegram:
        condition: service_healthy
volumes:
  telegram_data:
  caddy_data:
  caddy_config:
